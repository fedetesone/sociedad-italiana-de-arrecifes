name: Verificación
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --check .
      - run: npm run check
      - run: npm test
      # Sin Sanity ni URL pública: este build se verifica pero no se despliega.
      - run: npm run build
        env:
          ALLOW_MISSING_BUILD_CONFIG: "1"
      - run: npm run verify:build
      # ID de prueba sintácticamente válido. No se realizan solicitudes al dataset.
      - run: npm run build:studio
        env:
          SANITY_STUDIO_PROJECT_ID: ci123456
          SANITY_STUDIO_DATASET: production
